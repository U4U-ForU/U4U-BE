spring:
  application:
    name: ufu

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  flyway:
    baseline-on-migrate: true
server:
  port: 8080

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

jwt:
  secretKey: ${JWT_SECRET_KEY}
  accessExp: ${ACCESS_EXP}
  refreshExp: ${REFRESH_EXP}
  header: ${HEADER}
  prefix: ${PREFIX}

cloud:
  aws:
    credentials:
      access-key: ${S3_ACCESS_KEY}
      secret-key: ${S3_SECRET_KEY}
    region:
      static: ${S3_REGION}
    s3:
      bucket: ${S3_BUCKET}
